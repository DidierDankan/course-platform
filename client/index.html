<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before anything renders (no flash of the wrong theme).
         Keep the key, names and default in sync with src/hooks/useTheme.js. -->
    <script>
      (function () {
        var theme = "brutal";
        try {
          var saved = localStorage.getItem("lumen-theme");
          if (saved === "brutal" || saved === "cinematic") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- "Lumen" here and below: keep in sync with APP_NAME in src/utils/brand/index.js.
         These are Home's tags and the defaults for every page. Link previews (LinkedIn, Slack, X) and most AI crawlers
         don't run JavaScript, so this static copy is all they see; src/hooks/usePageMeta.js changes title and
         description per page for the crawlers that do. %VITE_SITE_URL% is the site's address (vite.config.js). -->
    <title>Lumen · Video courses from independent makers</title>
    <meta name="description" content="Video courses from independent makers: buy once, learn at your own pace, keep forever. A full-stack portfolio project built with React, Express and MySQL." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumen" />
    <meta property="og:title" content="Lumen · Video courses from independent makers" />
    <meta property="og:description" content="Video courses from independent makers: buy once, learn at your own pace, keep forever. A full-stack portfolio project built with React, Express and MySQL." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lumen: learn from people who live the craft. Buy once, learn your way, keep forever." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumen · Video courses from independent makers" />
    <meta name="twitter:description" content="Video courses from independent makers: buy once, learn at your own pace, keep forever. A full-stack portfolio project built with React, Express and MySQL." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
